<div class="text-center" *ngIf="isLogged; else loggedOut">
  <h2>Ya has iniciado sesión</h2>
</div>

<ng-template #loggedOut>
  <section class="contenedor">
    <div class="card-formulario">
      <form #f="ngForm" (ngSubmit)="onLogin()" novalidate class="formulario">
        <div class="info-login">
          <h1 class="titulo-login">
            <span class="bienvenido">HELLO,</span>
            <span class="bienvenido destacado">AVAX</span>
          </h1>
          <p class="subtitulo">Te damos la bienvenida al sistema</p>
        </div>

        <div class="input usuario">
          <label for="login">Nombre de usuario:</label>
          <div class="input-container">
            <i class="fa fa-user icon"></i>
            <input
              placeholder="Escriba su nombre de usuario"
              type="text"
              name="login"
              id="login"
              class="control"
              [(ngModel)]="loginUsuario.login"
              required
            />
          </div>
        </div>

        <div class="input clave">
          <label for="password">Contraseña:</label>
          <div class="input-container password-container">
            <mat-icon class="icon">lock</mat-icon> 
            
            <input
              matInput
              placeholder="Escriba su contraseña (min 8 caracteres)"
              [type]="hide ? 'password' : 'text'"
              [(ngModel)]="loginUsuario.password"
              name="password"
              class="control" id="password"
              minlength="8" required
            />
            
            <button
              mat-icon-button
              type="button" (click)="hide = !hide"
              [attr.aria-label]="'Ocultar contraseña'"
              [attr.aria-pressed]="hide"
              class="visibility-toggle"
            >
              <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
            </button>
          </div>
        </div>
        <div class="input__ingresar">
          <button [disabled]="!f.valid" class="btn-login">
            <i class="fa fa-sign-in"></i> Ingresar
          </button>
        </div>

        <div class="problems">
          <a routerLink="/forgot-password">Forgot Password</a>
        </div>
      </form>
    </div>
    <div class="card-imagen">
      <img
        src="../../assets/login_img/logo_iniciar_sesion.webp"
        alt="Imagen de login"
        class="imagen-logo"
      />
    </div>
  </section>
</ng-template>
